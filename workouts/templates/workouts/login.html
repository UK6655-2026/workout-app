<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
</head>
<body>

    <h1>ログイン</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <p>
            <label>ユーザー名</label>
            <input type="text" name="username">
        </p>

        <p>
            <label>パスワード</label>
            <input type="password" name="password">
        </p>

        <button type="submit">ログイン</button>
    </form>

    <p>
        <a href="{% url 'register' %}">
            新規登録はこちら
        </a>
    </p>

</body>
</html>
