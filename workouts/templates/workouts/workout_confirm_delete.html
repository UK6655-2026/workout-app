{% load static %}

<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <title>トレーニング削除</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <div class="container">

        <header class="header">

            <h1>筋トレ管理アプリ</h1>

            <p>
                トレーニング削除
            </p>

        </header>


        <main>

            <div class="card goal-form-card">

                <h2>トレーニングを削除</h2>

                <p>
                    {{ workout.workout_date }} のトレーニングを削除しますか？
                </p>

                <p>
                    削除すると、このトレーニングに登録されている
                    種目やセットも削除されます。
                </p>


                <form method="POST">

                    {% csrf_token %}

                    <button type="submit" class="button primary-button">
                        削除する
                    </button>

                </form>

            </div>


            <footer>

                <a class="text-link" href="{% url 'workout_list' %}">
                    キャンセル
                </a>

                <a class="text-link" href="{% url 'home' %}">
                    ホームに戻る
                </a>

            </footer>

        </main>

    </div>

</body>

</html>
