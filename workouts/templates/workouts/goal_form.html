{% load static %}

<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>目標設定</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <div class="container">

        <header class="header">

            <h1>🎯 目標設定</h1>

            <p>
                自分の目標を設定しましょう
            </p>

        </header>


        <main>

            <section class="card goal-form-card">

                <form method="POST">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit" class="primary-button">
                        保存する
                    </button>

                </form>

            </section>

        </main>


        <footer>

            <a class="home-link" href="{% url 'home' %}">
                ← ホームに戻る
            </a>

        </footer>

    </div>

</body>

</html>
