{% load static %}

<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <title>体重を削除</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <div class="container">

        <header class="header">

            <h1>筋トレ管理アプリ</h1>

            <p>
                体重削除
            </p>

        </header>


        <main>

            <div class="card goal-form-card">

                <h2>体重を削除</h2>

                <p>
                    以下の記録を削除しますか？
                </p>

                <p>
                    日付：{{ weight.date }}
                </p>

                <p>
                    体重：{{ weight.weight }} kg
                </p>


                <form method="POST">

                    {% csrf_token %}

                    <button type="submit" class="button primary-button">
                        削除する
                    </button>

                </form>

            </div>


            <footer>

                <a class="text-link" href="{% url 'weight_list' %}">
                    キャンセル
                </a>

                <a class="text-link" href="{% url 'home' %}">
                    ホームに戻る
                </a>

            </footer>

        </main>

    </div>

</body>

</html>
