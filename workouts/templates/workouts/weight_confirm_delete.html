<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>体重を削除</title>
</head>

<body>

    <h1>体重を削除</h1>

    <p>
        以下の記録を削除しますか？
    </p>

    <p>
        日付：{{ weight.date }}
    </p>

    <p>
        体重：{{ weight.weight }} kg
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            削除する
        </button>

    </form>

    <br>

    <a href="{% url 'weight_list' %}">
        キャンセル
    </a>

    <br>

    <a href="{% url 'home' %}">
        ホームに戻る
    </a>
    
</body>

</html>
