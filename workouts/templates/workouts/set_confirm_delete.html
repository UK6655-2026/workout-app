<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>セット削除</title>
</head>

<body>

    <h1>セットを削除</h1>

    <p>
        種目：{{ workout_set.exercise.name }}
    </p>

    <p>
        {{ workout_set.weight }} kg × {{ workout_set.reps }}回
    </p>

    <p>
        このセットを削除しますか？
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            削除する
        </button>

    </form>

    <br>

    <a href="{% url 'workout_list' %}">
        キャンセル
    </a>

</body>

</html>
